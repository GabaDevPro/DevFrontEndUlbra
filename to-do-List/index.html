<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Tarefas — Projetos Acadêmicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Quadro de Tarefas</h1>
        <p>Projetos Acadêmicos</p>
        <br>
        <hr>
        <search>
            <form id="form-busca" action="">
                <fieldset>
                    <legend>Busca e filtros</legend>

                    <label for="busca">Buscar</label>
                    <input type="text" name="busca" id="busca" placeholder="Título, projeto ou responsável" autocomplete="off">

                    <label for="stts">Filtro por status</label>
                    <select name="status" id="stts">
                        <option value="">Todos</option>
                        <option value="fazer">A fazer</option>
                        <option value="andamento">Em andamento</option>
                        <option value="revisao">Em revisão</option>
                        <option value="concluida">Concluída</option>
                    </select>

                    <label for="prop">Filtro por prioridade</label>
                    <select name="prop" id="prop">
                        <option value="">Todas</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                    </select>

                    <button type="button">Buscar</button>
                </fieldset>
            </form>
        </search>

        <hr>
    </header>

    <!-- Região viva: existe desde o carregamento do documento e começa VAZIA.
         Precisa estar no HTML antes de qualquer mudança, porque o leitor de
         tela só anuncia alterações de elementos que ele já estava observando.
         Um elemento criado junto com a mensagem não anuncia nada. -->
    <p id="regiao-status" class="regiao-status" role="status" aria-live="polite"></p>

    <!-- Painel dos estados de carregando, vazio e erro. -->
    <div id="painel-estado" class="painel-estado" hidden></div>

    <main>

        <section class="afazer" aria-labelledby="col-fazer" data-status="fazer">
            <h2 id="col-fazer">A fazer <span class="contador"></span></h2>
            <ul></ul>
        </section>

        <section class="emandamento" aria-labelledby="col-andamento" data-status="andamento">
            <h2 id="col-andamento">Em andamento <span class="contador"></span></h2>
            <ul></ul>
        </section>

        <section class="emrevisao" aria-labelledby="col-revisao" data-status="revisao">
            <h2 id="col-revisao">Em revisão <span class="contador"></span></h2>
            <ul></ul>
        </section>

        <section class="concluidas" aria-labelledby="col-concluida" data-status="concluida">
            <h2 id="col-concluida">Concluídas <span class="contador"></span></h2>
            <ul></ul>
        </section>

    </main>
    <hr>
    <footer>
        <h2>Gabriel Rodrigues Costa Ferreira</h2>
        <p>Desenvolvimento Front-End</p>
    </footer>
    <br>
    <script type="module" src="js/main.js"></script>
</body>
</html>
