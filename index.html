<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Tarefas — Desenvolvimento Front-End</title>

    <!-- O GitHub Pages publica a raiz do repositório, e a aplicação vive na
         pasta `to-do-List/`. Este redirecionamento é o que faz a URL pública
         curta abrir o quadro, em vez de mostrar uma página vazia.
         O <meta refresh> funciona sem JavaScript; o link abaixo é a saída
         para quem tiver o redirecionamento bloqueado. -->
    <meta http-equiv="refresh" content="0; url=to-do-List/">
    <link rel="canonical" href="to-do-List/">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            gap: 1rem;
            font-family: system-ui, sans-serif;
            background: #f6efe0;
            color: #2a2f3a;
            text-align: center;
        }
        main { padding: 2rem; }
        a { color: #1e40af; }
    </style>
</head>
<body>
    <main>
        <h1>Quadro de Tarefas</h1>
        <p>Redirecionando para a aplicação…</p>
        <p><a href="to-do-List/">Abrir o quadro de tarefas</a></p>
    </main>
</body>
</html>
