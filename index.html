<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Tarefas — Desenvolvimento Front-End</title>

    <!-- O GitHub Pages publica a raiz do repositório, e a aplicação vive na
         pasta `to-do-List/`. Este redirecionamento é o que faz a URL pública
         curta abrir o quadro, em vez de mostrar uma página vazia.
         O <meta refresh> funciona sem JavaScript; o link abaixo é a saída
         para quem tiver o redirecionamento bloqueado. -->
    <meta http-equiv="refresh" content="0; url=to-do-List/">
    <link rel="canonical" href="to-do-List/">

    <!-- Estilo embutido, e curto: esta página existe por meio segundo, e
         qualquer arquivo externo aqui seria uma requisição a mais para
         atrasar o redirecionamento. -->
    <style>
        :root {
            --pergaminho: #efe3ca;
            --tinta: #2a2018;
            --ouro: #b08d3a;
            --rubrica: #7d1d1d;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --pergaminho: #17120d;
                --tinta: #ece0c8;
                --ouro: #cda54c;
                --rubrica: #cf8080;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "EB Garamond", "Palatino Linotype", Palatino, Georgia, serif;
            font-size: 1.125rem;
            background-color: var(--pergaminho);
            color: var(--tinta);
            text-align: center;
        }

        main {
            padding: 2rem;
            border-top: 3px double var(--ouro);
            border-bottom: 3px double var(--ouro);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.75rem, 1.2rem + 2.5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        p { margin: 0.5rem 0; font-style: italic; }

        a {
            color: var(--rubrica);
            font-style: normal;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-size: 0.9375rem;
        }

        a:focus-visible {
            outline: 3px solid var(--rubrica);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Quadro de Tarefas</h1>
        <p>Redirecionando para a aplicação…</p>
        <p><a href="to-do-List/">Abrir o quadro de tarefas</a></p>
    </main>
</body>
</html>
